# Local hosting/testing. See README.md.
#   docker compose up --build site               -> production build at http://localhost:8080
#   docker compose --profile dev up dev          -> astro dev with hot reload at http://localhost:4321
#   docker compose --profile mockup up mockup    -> the sign-off mockup at http://localhost:8081
services:
  site:
    build: .
    ports:
      - "8080:80"

  dev:
    profiles: [dev]
    image: node:26.12.1-alpine
    working_dir: /site
    command: sh -c "npm ci --no-fund --no-audit && npx astro dev --host 0.0.0.0"
    ports:
      - "4321:4321"
    volumes:
      - .:/site
      - node_modules:/site/node_modules
      # The content cache holds absolute paths, so the container keeps its own.
      - astro_cache:/site/.astro

  mockup:
    profiles: [mockup]
    image: nginx:1.31.8-alpine
    ports:
      - "8081:80"
    volumes:
      - ./mockup:/usr/share/nginx/html:ro

volumes:
  node_modules:
  astro_cache:
